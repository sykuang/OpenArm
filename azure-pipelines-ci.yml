trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

jobs:
- job: RepositoryValidation
  displayName: Offline workflow checks and x64 sample
  timeoutInMinutes: 30
  pool:
    vmImage: windows-latest
  workspace:
    clean: all
  steps:
  - checkout: self
    persistCredentials: false
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
      architecture: x64
  - task: PowerShell@2
    inputs:
      pwsh: true
      filePath: scripts\Test-Project.ps1
      arguments: -Output "$(Build.ArtifactStagingDirectory)\repository-validation"
  - publish: $(Build.ArtifactStagingDirectory)\repository-validation
    artifact: repository-validation
    condition: always()
